# LivingroomOS – greetd: automatically logs in as "livingroomos" at startup and launches labwc.
# Installation: copy to /etc/greetd/config.toml (see INSTALL.md). NOT TESTED on physical hardware.

[terminal]
vt = 1

# Shown only if the automatic session exits (for example, after too many labwc crashes):
# a simple text login. This is the architecture's fallback state.
[default_session]
command = "agreety --cmd /bin/bash"
user = "_greetd"

# Runs exactly once per boot; the restart loop is therefore implemented in the session script.
[initial_session]
command = "/opt/livingroomos/system/bin/livingroomos-session"
user = "livingroomos"
